<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting | ChemTable PWA</title>
    <script>
      // Single Page Apps for GitHub Pages redirection handler
      // Redirects 404s back to root index.html preserving route
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var redirectTarget = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      window.location.replace('./index.html' + l.hash);
    </script>
  </head>
  <body style="background-color: #0b0f19; color: #bae6fd; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to Periodic Table...</p>
  </body>
</html>
